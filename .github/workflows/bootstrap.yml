name: Bootstrap full website source

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand website
        shell: bash
        run: |
          set -euo pipefail
          if [ -f index.html ]; then
            echo "Website source already expanded."
            exit 0
          fi
          cat bootstrap/site.zip.b64.* | base64 -d > /tmp/site.zip
          set +e
          unzip -o /tmp/site.zip -d /tmp/site
          unzip_code=$?
          set -e
          if [ "$unzip_code" -gt 2 ]; then
            exit "$unzip_code"
          fi
          cp /tmp/site/index.html ./index.html
          cp /tmp/site/404.html ./404.html
          cp /tmp/site/app.js ./app.js
          cp /tmp/site/data.js ./data.js
          cp /tmp/site/styles.css ./styles.css
          cp /tmp/site/README.md ./README.md
          rm -rf bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand Sproochentest Trainer website source"
          git push
